# Windows 用の gototask.exe（画面）と gtask.exe（ターミナル用コマンド）を作る。
# v から始まるタグを push するとリリースに付ける（手動でも動かせる）
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.19.0
      - run: pyinstaller --noconfirm --onefile --windowed --name gototask --add-data "static;static" gototask.pyw
      # gtask.exe：コマンド本体（拡張子なしの gototask）を .py にして、黒い窓ありで固める。
      # データは gototask.exe と同じ %APPDATA%\gototask を使う。`gtask serve` 用に static も同梱。
      - name: gtask.exe
        shell: pwsh
        run: |
          Copy-Item gototask gtask_cli.py
          pyinstaller --noconfirm --onefile --console --name gtask --add-data "static;static" gtask_cli.py
      - name: gtask.exe が動くか
        shell: pwsh
        env:
          GOTOTASK_DATA: ${{ runner.temp }}\gototask-smoke
        run: |
          ./dist/gtask.exe -h
          if ($LASTEXITCODE -ne 0) { throw "gtask -h failed" }
          ./dist/gtask.exe ls
          if ($LASTEXITCODE -ne 0) { throw "gtask ls failed" }
      - name: SHA-256
        shell: pwsh
        run: |
          (Get-FileHash dist/gototask.exe -Algorithm SHA256).Hash | Tee-Object dist/gototask.exe.sha256
          (Get-FileHash dist/gtask.exe -Algorithm SHA256).Hash | Tee-Object dist/gtask.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gototask-windows
          path: |
            dist/gototask.exe*
            dist/gtask.exe*
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/gototask.exe dist/gototask.exe.sha256 dist/gtask.exe dist/gtask.exe.sha256 --title ${{ github.ref_name }} --notes "Windows 用。gototask.exe はダブルクリックで起動します（Python は不要）。gtask.exe はターミナル用のコマンドで、PATH の通ったフォルダに置くと gtask ls などが使えます（gototerm の右クリックメニューにも出ます）。"
